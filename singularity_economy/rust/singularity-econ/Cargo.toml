[package]
name = "singularity-econ"
version = "0.2.0"
edition = "2021"
description = "Systems-dynamics model of the 2026-2036 economy under a software-singularity / robotics thesis (Meadows v2 core)"
license = "MIT"

[features]
default = ["serde", "mc"]
serde = ["dep:serde"]
mc = ["dep:rand", "dep:rand_chacha"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
rand = { version = "0.8", optional = true }
rand_chacha = { version = "0.3", optional = true }

[dev-dependencies]
proptest = "1"

[[bin]]
name = "singularity-econ"
path = "src/main.rs"
required-features = ["serde", "mc"]

[profile.release]
lto = true
codegen-units = 1
