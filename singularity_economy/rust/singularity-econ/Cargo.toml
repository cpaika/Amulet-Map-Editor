[package]
name = "singularity-econ"
version = "0.2.0"
edition = "2021"
description = "Systems-dynamics model of the 2026-2036 economy under a software-singularity / robotics thesis (Meadows v2 core)"
license = "MIT"

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"

[dev-dependencies]
proptest = "1"

[[bin]]
name = "singularity-econ"
path = "src/main.rs"
required-features = ["serde"]

[profile.release]
lto = true
codegen-units = 1
